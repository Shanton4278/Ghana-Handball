<section>
  <div class="gallery-bg">
    <div class="gallery-text">Our Gallery</div>
    <p style="text-align: center; font-size: 16px;">Explore moments that showcase the passion and progress of handball in Ghana,<br>
       from exciting matches to community-driven programs.</p>
  </div>
    
<div class="gallery-grid">
    <div class="gallery-item" *ngFor="let image of images">
      <img [src]="image.url" [alt]="image.alt" />
    </div>
  </div>
</section>
